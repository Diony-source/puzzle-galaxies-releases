<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="gal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="gal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.65"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Grid & Symmetric Galaxy Shape -->
  <g transform="translate(76, 76)">
    <!-- Background grid -->
    <rect x="0" y="0" width="360" height="360" rx="16" fill="#0f172a" stroke="#475569" stroke-width="6"/>
    <!-- Symmetric L-shaped polyomino galaxy -->
    <path d="M 0 120 L 240 120 L 240 0 L 360 0 L 360 240 L 120 240 L 120 360 L 0 360 Z" fill="url(#gal1)" stroke="#e2e8f0" stroke-width="10" stroke-linejoin="round"/>
    <!-- Top-left & Bottom-right galaxies -->
    <rect x="0" y="0" width="240" height="120" fill="url(#gal2)" stroke="#e2e8f0" stroke-width="10" stroke-linejoin="round"/>
    <rect x="120" y="240" width="240" height="120" fill="url(#gal2)" stroke="#e2e8f0" stroke-width="10" stroke-linejoin="round"/>
    <!-- Subtle inner grid lines -->
    <line x1="120" y1="0" x2="120" y2="360" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8" opacity="0.5"/>
    <line x1="240" y1="0" x2="240" y2="360" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8" opacity="0.5"/>
    <line x1="0" y1="120" x2="360" y2="120" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8" opacity="0.5"/>
    <line x1="0" y1="240" x2="360" y2="240" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8" opacity="0.5"/>
    <!-- Outer frame -->
    <rect x="0" y="0" width="360" height="360" rx="8" fill="none" stroke="#f8fafc" stroke-width="12"/>
    <!-- Galaxy Dots (Centers of Symmetry) -->
    <circle cx="180" cy="180" r="22" fill="#ffffff" stroke="#1e1b4b" stroke-width="8"/>
    <circle cx="180" cy="180" r="8" fill="#6366f1"/>
    <circle cx="120" cy="60" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="7"/>
    <circle cx="240" cy="300" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="7"/>
  </g>
</svg>

